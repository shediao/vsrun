name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-msvc:
    runs-on: windows-latest
    name: "Build & Test (MSVC)"
    strategy:
      fail-fast: false

      matrix:
        build_type: [Release, Debug]
        c_compiler: [clang, cl]
        include:
          - c_compiler: cl
            cpp_compiler: cl
          - c_compiler: clang
            cpp_compiler: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -B build/${{ matrix.c_compiler }}/${{ matrix.build_type }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DVSRUN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/${{ matrix.c_compiler }}/${{ matrix.build_type }} --config ${{ matrix.build_type }}

      - name: Test
        run: |
          cd build/${{ matrix.c_compiler }}/${{ matrix.build_type }}
          ctest --output-on-failure -C ${{ matrix.build_type }}

  build-mingw64:
    runs-on: windows-latest
    name: "Build & Test (MinGW64)"

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Configure
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVSRUN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          cd build
          ctest --output-on-failure -C Release
